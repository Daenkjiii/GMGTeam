<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Saya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="border-b border-slate-800 p-5">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider text-indigo-400">MY WEBSITE</h1>
      <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-3 py-1 rounded-full">Netlify Ready</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-12 text-center">
    <div class="inline-block p-3 bg-indigo-600/10 rounded-full mb-6 text-indigo-400">
      🚀 Website Berhasil Tayang
    </div>
    
    <h2 class="text-3xl font-extrabold mb-4 text-white leading-tight">
      Halo! Selamat Datang di Website Saya
    </h2>
    
    <p class="text-slate-400 text-base mb-8 leading-relaxed">
      Website ini dibuat dari HP, disimpan di GitHub, dan dideploy gratis oleh Netlify.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a href="https://github.com" target="_blank" class="bg-indigo-600 text-white font-medium px-6 py-3 rounded-lg">
        Buka GitHub
      </a>
      <a href="https://netlify.com" target="_blank" class="bg-slate-800 text-slate-200 border border-slate-700 font-medium px-6 py-3 rounded-lg">
        Buka Netlify
      </a>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-slate-500 text-sm">
    <p>&copy; 2026 Website Saya</p>
  </footer>

</body>
</html>
